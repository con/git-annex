repo: datalad/git-annex
vars:
  common_path: 'builds/{year}/{month}//{type}-{type_id[:8]}/{wf_file}-{number}-{build_commit[:8]}-{common_status}/'
ci:
  github:
    paths:
      logs: '{common_path}'
      # place artifacts along with the logs
      artifacts: '{common_path}'
      # but releases separately and without subdataset
      releases: 'releases/{release_tag}/'
    workflows:
    - build-macos.yaml
    - build-ubuntu.yaml
    - build-windows.yaml
since: 2021-03-01T00:00:00Z
types: [cron, pr, push]
datalad:
  enabled: true
  cfg_proc: text2git
